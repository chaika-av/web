<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBD — эффекты</title>
<style>
  html,body{margin:0;height:100%;height:100dvh;background:#07070b;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #warp,#aura,#fx{position:absolute;inset:0;width:100%;height:100%;display:none}
  #warp{display:block}
  #aura{object-fit:cover}
  video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}

  #ui{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#07070b;padding:24px;text-align:center}
  #ui h1{margin:0;font-size:26px;font-weight:700}
  #msg{max-width:460px;font-size:15px;line-height:1.45;opacity:.75}
  #retry{display:none;font:600 17px system-ui,sans-serif;padding:12px 28px;border:0;border-radius:12px;background:#ff5a8a;color:#210;cursor:pointer}

  #hint{position:absolute;left:10px;top:8px;font-size:12px;opacity:.4;z-index:4;pointer-events:none;transition:opacity .6s}
  #toast{position:absolute;right:12px;top:10px;font-size:13px;opacity:0;transition:opacity .4s;z-index:4;pointer-events:none;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:8px}

  /* нижняя панель: режимы + настройки текущего режима */
  #bar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:6;flex-direction:column;align-items:center;gap:8px;
       padding:26px 10px max(12px,env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6));transition:opacity .5s}
  body.started #bar{display:flex}
  body.idle #bar,body.idle #hint{opacity:0;pointer-events:none}
  body.noui #bar,body.noui #hint{display:none}
  #chips{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:2px 4px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  #chips button,#chips label{flex:none;font:600 14px system-ui,sans-serif;display:flex;align-items:center;gap:6px;padding:9px 15px;min-height:20px;border:0;border-radius:20px;color:#fff;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer}
  #chips button.on{background:#fff;color:#111}
  #chips input[type=range]{width:96px}
  #modes{display:flex;gap:6px;width:min(680px,100%)}
  #modes button{flex:1;min-width:0;padding:0 2px;min-height:48px;font:700 15px system-ui,sans-serif;border:0;border-radius:14px;color:#fff;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer}
  #modes button.on{background:#ff5a8a;color:#210}
  @media (max-width:480px){#modes button{font-size:13px}#modes{gap:4px}}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<div id="ui">
  <h1>Эффекты IBD</h1>
  <div id="msg">Запускаю камеру… Разреши доступ, когда браузер спросит.</div>
  <button id="retry">Повторить</button>
</div>
<canvas id="warp"></canvas>
<canvas id="aura"></canvas>
<canvas id="fx"></canvas>
<div id="hint"></div>
<div id="toast"></div>
<div id="bar">
  <div id="chips"></div>
  <div id="modes">
    <button data-e="1">Время</button>
    <button data-e="2">Аура</button>
    <button data-e="3">Глитч</button>
    <button data-e="4">Сетка</button>
    <button data-e="5">Растр</button>
    <button data-e="6">Вода</button>
  </div>
</div>
<video id="video" playsinline webkit-playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video');
const warpCanvas = $('warp'), auraCanvas = $('aura'), fxCanvas = $('fx'), toastEl = $('toast'), hintEl = $('hint');
const isTouch = matchMedia('(pointer:coarse)').matches;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function toast(t){ toastEl.textContent = t; toastEl.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => toastEl.style.opacity = 0, 1600); }

/* ================= ОБЩЕЕ СОСТОЯНИЕ ================= */
let effect = 1, auto = false, autoT = 0, started = false, segOK = true, seg = null, segReady = false;
const EFFECTS = ['', 'Время (развёртка)', 'Аура', 'Глитч', 'Сетка-плёнка', 'Растр', 'Вода'];
const WATER_NAMES = ['Бассейн: солнечная сетка сверху', 'Под водой', 'Через банку с водой'];
const NFX = 6;
const WARP_MODES = ['Сверху вниз (голова течёт)', 'Слева направо', 'Волна', 'Тоннель от центра'];
const AURA_BGS = ['затемнён', 'чёрный', 'как есть'];
let warpMode = 0, rev = false, chroma = false, DMAX = 40;   // эффект 1: время
let auraBg = 0, auraSens = 1, auraDens = 1;                 // эффект 2: аура
let fxStr = 1;                                              // общая «сила» эффектов 3–5
let glRGB = true, glLocal = true;                           // эффект 3: глитч
let gridN = 26, gridVideo = true;                           // эффект 4: сетка-плёнка
let dotPx = 9, dotColor = false, dotInv = false;            // эффект 5: растр
let waterVar = 0, waterScale = 1.6;                         // эффект 6: вода (0 бассейн, 1 под водой, 2 банка)

/* ================= ЭФФЕКТ 1: РАЗВЁРТКА ВРЕМЕНИ (slit-scan) ================= */
const WARP = {COLS: 8, ROWS: 8, N: 64, FPS: 30};
let gl = null, wU = {}, atlas, capC, capX, TW = 480, TH = 270, head = -1, filled = 0, lastCap = 0;

const W_VERT = `attribute vec2 a; varying vec2 vUv;
void main(){ vUv = vec2(a.x * 0.5 + 0.5, 0.5 - a.y * 0.5); gl_Position = vec4(a, 0.0, 1.0); }`;
const W_FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uAtlas;
uniform vec2 uCover, uTile, uHalf;
uniform float uHead, uN, uDmax, uTime, uChroma, uRev, uFilled, uMode;
vec3 fetch(float slot, vec2 uv){
  float cx = mod(slot, 8.0), cy = floor(slot / 8.0);
  vec2 t = clamp(uv, uHalf, 1.0 - uHalf);
  return texture2D(uAtlas, (vec2(cx, cy) + t) * uTile).rgb;
}
vec3 sampleD(vec2 uv, float d){
  d = clamp(d, 0.0, max(0.0, min(uDmax, uFilled - 1.0)));
  float i0 = floor(d), f = d - i0;
  float s0 = mod(uHead - i0 + uN * 2.0, uN);
  float s1 = mod(uHead - i0 - 1.0 + uN * 2.0, uN);
  return mix(fetch(s0, uv), fetch(s1, uv), f);
}
float delayK(vec2 p){
  float k;
  if (uMode < 0.5) k = 1.0 - p.y;
  else if (uMode < 1.5) k = p.x;
  else if (uMode < 2.5) k = 0.5 + 0.5 * sin(p.y * 9.4 + uTime * 1.4);
  else k = clamp(length((p - 0.5) * vec2(1.0, 0.9)) * 1.6, 0.0, 1.0);
  if (uRev > 0.5) k = 1.0 - k;
  return k;
}
void main(){
  vec2 p = (vUv - 0.5) * uCover + 0.5;
  float d = delayK(p) * uDmax;
  vec3 c;
  c.r = sampleD(p, d * (1.0 - uChroma)).r;
  c.g = sampleD(p, d).g;
  c.b = sampleD(p, d * (1.0 + uChroma)).b;
  gl_FragColor = vec4(c, 1.0);
}`;

function initWarp(vw, vh){
  gl = warpCanvas.getContext('webgl', {antialias: false, alpha: false});
  if (!gl) return false;
  const mx = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  TW = Math.min(isTouch ? 400 : 480, Math.floor(mx / WARP.COLS));
  TH = Math.min(Math.floor(mx / WARP.ROWS), Math.round(TW * vh / vw));
  capC = mk(TW, TH); capX = capC.getContext('2d');
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, W_VERT)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, W_FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uAtlas','uCover','uTile','uHalf','uHead','uN','uDmax','uTime','uChroma','uRev','uFilled','uMode']) wU[n] = gl.getUniformLocation(prog, n);
  atlas = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, atlas);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, WARP.COLS * TW, WARP.ROWS * TH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(wU.uAtlas, 0);
  gl.uniform2f(wU.uTile, 1 / WARP.COLS, 1 / WARP.ROWS);
  gl.uniform2f(wU.uHalf, 0.5 / TW, 0.5 / TH);
  gl.uniform1f(wU.uN, WARP.N);
  warpReset();
  return true;
}
function warpReset(){ head = -1; filled = 0; lastCap = 0; }

function warpFrame(t){
  if (!video.videoWidth) return;
  if (!gl){
    let ok = false; try { ok = initWarp(video.videoWidth, video.videoHeight); } catch (e){ console.warn(e); }
    if (!ok){ toast('WebGL недоступен'); gl = null; setEffect(2); return; }
  }
  const dpr = Math.min(devicePixelRatio || 1, 1.5), W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  if (warpCanvas.width !== W || warpCanvas.height !== H){ warpCanvas.width = W; warpCanvas.height = H; }
  gl.viewport(0, 0, W, H);
  if (t - lastCap >= 1 / WARP.FPS){
    lastCap = t; head = (head + 1) % WARP.N; filled = Math.min(WARP.N, filled + 1);
    capX.setTransform(-1, 0, 0, 1, TW, 0); capX.drawImage(video, 0, 0, TW, TH); capX.setTransform(1, 0, 0, 1, 0, 0);
    gl.bindTexture(gl.TEXTURE_2D, atlas);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, (head % WARP.COLS) * TW, Math.floor(head / WARP.COLS) * TH, gl.RGBA, gl.UNSIGNED_BYTE, capC);
  }
  const a = TW / TH, A = W / H;
  gl.uniform2f(wU.uCover, a > A ? A / a : 1, a > A ? 1 : a / A);
  gl.uniform1f(wU.uHead, Math.max(0, head)); gl.uniform1f(wU.uFilled, filled);
  gl.uniform1f(wU.uDmax, DMAX); gl.uniform1f(wU.uTime, t);
  gl.uniform1f(wU.uChroma, chroma ? 0.14 : 0); gl.uniform1f(wU.uRev, rev ? 1 : 0); gl.uniform1f(wU.uMode, warpMode);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ================= ЭФФЕКТ 2: АУРА ИЗ ЧАСТИЦ ================= */
// белые одинаковые мелкие частицы по контуру тела; каждая тянет за собой шлейф из последних позиций
const AURA = (() => {
  const cv = auraCanvas, ctx = cv.getContext('2d');
  const BASE_RATE = 1500;                 // частиц в секунду в покое
  const PEAK_RATE = 6500;                 // добавка при сильном движении
  const MAXP = isTouch ? 4500 : 9000;     // максимум частиц (на телефоне меньше)
  const PSCALE = MAXP / 9000;
  const L = isTouch ? 7 : 12;             // длина шлейфа в кадрах
  const LINE_W = 1.3;                     // толщина полосы (в «пикселях 720p») — одинаковая у всех
  const GRID_LONG = 176;
  let W = 0, H = 0, GW = 0, GH = 0, S = 1, isReady = false;
  let target = 0, energy = 0, hasPerson = false, hasPrev = false;
  let gX, mX, mA, mAx, mAimg, cut, cutX, gray, prev, mask, motion, mblur, tmp, cIdx, cNx, cNy, cN = 0;
  let px, py, pvx, pvy, page, plife, palive, pb, hist, pptr = 0, carry = 0, hf = 0, lastT = 0;
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const mkCtx = (w, h) => mk(w, h).getContext('2d', {willReadFrequently: true});

  function setup(vw, vh){
    const sc = Math.min(1, (isTouch ? 960 : 1280) / Math.max(vw, vh));
    W = 2 * Math.round(vw * sc / 2); H = 2 * Math.round(vh * sc / 2);
    cv.width = W; cv.height = H; S = W / 720;
    const g = GRID_LONG / Math.max(W, H);
    GW = Math.max(16, Math.round(W * g)); GH = Math.max(16, Math.round(H * g));
    const n = GW * GH;
    gX = mkCtx(GW, GH); mX = mkCtx(GW, GH);
    mA = mk(GW, GH); mAx = mA.getContext('2d'); mAimg = mAx.createImageData(GW, GH);
    for (let i = 0; i < n; i++){ mAimg.data[i*4] = mAimg.data[i*4+1] = mAimg.data[i*4+2] = 255; }
    cut = mk(W, H); cutX = cut.getContext('2d');
    gray = new Float32Array(n); prev = new Float32Array(n); mask = new Float32Array(n);
    motion = new Float32Array(n); mblur = new Float32Array(n); tmp = new Float32Array(n);
    cIdx = new Int32Array(n); cNx = new Float32Array(n); cNy = new Float32Array(n); cN = 0;
    px = new Float32Array(MAXP); py = new Float32Array(MAXP); pvx = new Float32Array(MAXP); pvy = new Float32Array(MAXP);
    page = new Float32Array(MAXP); plife = new Float32Array(MAXP);
    palive = new Uint8Array(MAXP); pb = new Uint8Array(MAXP);
    hist = new Float32Array(L * MAXP * 2);
    pptr = 0; carry = 0; hf = 0; hasPrev = false; energy = target = 0; isReady = true;
  }
  function reset(){ isReady = false; }
  function enter(){ lastT = performance.now() / 1000; }

  function drawSrc(c, src, dw, dh){ c.setTransform(-1, 0, 0, 1, dw, 0); c.drawImage(src, 0, 0, dw, dh); c.setTransform(1, 0, 0, 1, 0, 0); }
  function blur(src, dst, w, h, r){
    const inv = 1 / (2 * r + 1);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      let s = 0; for (let k = -r; k <= r; k++) s += src[y*w + clamp(x + k, 0, w - 1)];
      tmp[y*w + x] = s * inv;
    }
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
      let s = 0; for (let k = -r; k <= r; k++) s += tmp[clamp(y + k, 0, h - 1)*w + x];
      dst[y*w + x] = s * inv;
    }
  }
  function analyze(m){
    if (!video.videoWidth) return;
    if (!isReady) setup(video.videoWidth, video.videoHeight);
    const n = GW * GH;
    drawSrc(gX, video, GW, GH);
    const gd = gX.getImageData(0, 0, GW, GH).data;
    for (let i = 0; i < n; i++) gray[i] = gd[i*4]*0.3 + gd[i*4+1]*0.59 + gd[i*4+2]*0.11;
    if (m){
      mX.clearRect(0, 0, GW, GH); drawSrc(mX, m, GW, GH);
      const md = mX.getImageData(0, 0, GW, GH).data; let amin = 255;
      for (let i = 0; i < n; i++) if (md[i*4+3] < amin) amin = md[i*4+3];
      const ch = amin < 250 ? 3 : 0;
      for (let i = 0; i < n; i++) mask[i] = mask[i] * 0.5 + (md[i*4 + ch] / 255) * 0.5;
    } else mask.fill(0);
    if (hasPrev) for (let i = 0; i < n; i++) motion[i] = clamp((Math.abs(gray[i] - prev[i]) - 7) / 35);
    else motion.fill(0);
    prev.set(gray); hasPrev = true;
    blur(motion, mblur, GW, GH, 2);
    let pa = 0; for (let i = 0; i < n; i++) if (mask[i] > 0.3) pa++;
    hasPerson = pa > n * 0.012;
    let sum = 0, cnt = 0;
    for (let i = 0; i < n; i++) if (!hasPerson || mask[i] > 0.25){ sum += motion[i]; cnt++; }
    target = clamp(Math.sqrt(cnt ? sum / cnt : 0) * 2.6 * auraSens);
    cN = 0;
    if (hasPerson){
      for (let y = 2; y < GH - 2; y++) for (let x = 2; x < GW - 2; x++){
        const i = y*GW + x;
        if (mask[i] > 0.5 && (mask[i-1] <= 0.5 || mask[i+1] <= 0.5 || mask[i-GW] <= 0.5 || mask[i+GW] <= 0.5)){
          let nx = mask[i-2] - mask[i+2], ny = mask[i-2*GW] - mask[i+2*GW];
          const l = Math.hypot(nx, ny);
          if (l < 0.05){ const a = Math.random() * 6.283; nx = Math.cos(a); ny = Math.sin(a); } else { nx /= l; ny /= l; }
          cIdx[cN] = i; cNx[cN] = nx; cNy[cN] = ny; cN++;
        }
      }
    } else {
      for (let i = 0; i < n; i++) if (mblur[i] > 0.3){ const a = Math.random() * 6.283; cIdx[cN] = i; cNx[cN] = Math.cos(a); cNy[cN] = Math.sin(a); cN++; }
    }
    if (auraBg === 1){
      const d = mAimg.data;
      for (let i = 0; i < n; i++) d[i*4+3] = clamp((mask[i] - 0.3) * 2.5) * 255;
      mAx.putImageData(mAimg, 0, 0);
    }
  }

  function emit(dt){
    if (!cN) return;
    const want = (BASE_RATE + energy * PEAK_RATE) * PSCALE * auraDens * dt + carry;
    const cnt = Math.floor(want); carry = want - cnt;
    const kx = W / GW, ky = H / GH;
    for (let k = 0; k < cnt; k++){
      let j = (Math.random() * cN) | 0;
      const j2 = (Math.random() * cN) | 0;
      if (mblur[cIdx[j2]] > mblur[cIdx[j]]) j = j2;
      const idx = cIdx[j], lm = mblur[idx];
      const p = pptr; pptr = (pptr + 1) % MAXP;
      const x = ((idx % GW) + Math.random()) * kx, y = (((idx / GW) | 0) + Math.random()) * ky;
      px[p] = x; py[p] = y;
      const sp = (35 + Math.random() * 95) * S * (1 + energy * 1.8) * (1 + lm * 1.5);
      pvx[p] = cNx[j] * sp + (Math.random() - 0.5) * 40 * S;
      pvy[p] = cNy[j] * sp - (15 + Math.random() * 45) * S;
      page[p] = 0; plife[p] = 1.0 + Math.random() * 1.2 + energy * 0.5;
      palive[p] = 1;
      for (let s = 0; s < L; s++){ const o = (s * MAXP + p) * 2; hist[o] = x; hist[o+1] = y; }   // шлейф начинается из точки рождения
    }
  }

  const ALPHAS = [0.14, 0.26, 0.42, 0.62];
  function frame(now){
    if (!isReady){ if (video.videoWidth) setup(video.videoWidth, video.videoHeight); else return; }
    const t = now / 1000, dt = Math.min(0.05, Math.max(0.001, t - lastT)); lastT = t;
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if (video.readyState >= 2){
      if (auraBg === 1 && hasPerson){
        cutX.globalCompositeOperation = 'source-over'; cutX.clearRect(0, 0, W, H);
        cutX.drawImage(mA, 0, 0, W, H);
        cutX.globalCompositeOperation = 'source-in'; drawSrc(cutX, video, W, H);
        cutX.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, W, H); ctx.drawImage(cut, 0, 0);
      } else {
        drawSrc(ctx, video, W, H);
        if (auraBg !== 2){ ctx.fillStyle = auraBg === 1 ? 'rgba(4,4,10,.8)' : 'rgba(4,4,10,.55)'; ctx.fillRect(0, 0, W, H); }
      }
    } else { ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, W, H); }

    energy += (target - energy) * (target > energy ? 0.35 : 0.05);
    emit(dt);

    const drag = Math.exp(-dt * 1.6), lift = 70 * S, a = t * 0.9, inv = 1 / S;
    const h = (++hf) % L;
    for (let i = 0; i < MAXP; i++){
      pb[i] = 255;
      if (!palive[i]) continue;
      page[i] += dt;
      const u = page[i] / plife[i];
      if (u >= 1){ palive[i] = 0; continue; }
      let x = px[i], y = py[i], vx = pvx[i], vy = pvy[i];
      vx += Math.sin(y * 0.017 * inv + a + x * 0.006 * inv) * 90 * S * dt * (0.6 + energy);
      vy += (Math.cos(x * 0.015 * inv - a * 1.3) * 60 * S - lift) * dt;
      vx *= drag; vy *= drag; x += vx * dt; y += vy * dt;
      px[i] = x; py[i] = y; pvx[i] = vx; pvy[i] = vy;
      const o = (h * MAXP + i) * 2; hist[o] = x; hist[o+1] = y;
      if (x < -30 || y < -30 || x > W + 30 || y > H + 30) continue;
      const k = 1 - u; pb[i] = k > 0.75 ? 3 : k > 0.5 ? 2 : k > 0.25 ? 1 : 0;
    }

      ctx.strokeStyle = `rgba(255,255,255,${ALPHAS[b]})`;

/* ================= ЭФФЕКТЫ 3–5: ГЛИТЧ / СЕТКА-ПЛЁНКА / РАСТР (один шейдер) ================= */
// CPU считает маленькую «карту движения» (и маску силуэта, если модель загружена), GPU рисует картинку.
const FX_FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uVid, uField;
uniform vec2 uCover, uRes, uTexel;
uniform float uMode, uTime, uE, uStr, uHasMask, uA, uB, uC, uAsp, uDpr;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec2 toImg(vec2 uv){ return (uv - 0.5) * uCover + 0.5; }
vec3 vid(vec2 p){ return texture2D(uVid, vec2(1.0 - p.x, p.y)).rgb; }
vec2 fld(vec2 p){ return texture2D(uField, p).rg; }
float pres(vec2 p){ vec2 f = fld(p); return mix(f.r * 0.8, max(f.g, f.r * 0.6), uHasMask); }

vec3 glitch(vec2 uv){
  vec2 p = toImg(uv);
  float f = fld(p).r;
  float a = clamp(uStr * mix(uE * 1.6 + f * 1.25, f * 2.5, uB), 0.0, 1.0);
  a *= smoothstep(0.02, 0.08, a);   // без движения глитча нет совсем
  float tt = mod(floor(uTime * 13.0), 997.0);
  float by = floor(p.y * 48.0);
  float rb = hash(vec2(by, tt));
  float shift = 0.0;
  if (rb > 1.0 - 0.45 * a) shift = (hash(vec2(by, tt + 7.0)) - 0.5) * 0.12 * a;
  vec2 bid = floor(p * vec2(20.0, 30.0));
  vec2 bs = vec2(0.0);
  if (hash(bid + tt * 1.7) > 1.0 - 0.12 * a) bs = (vec2(hash(bid + 3.1), hash(bid + 9.7)) - 0.5) * 0.07 * a;
  vec2 q = p + vec2(shift, 0.0) + bs;
  float cid = floor(p.x * 90.0);
  if (hash(vec2(cid, floor(uTime * 4.0))) > 1.0 - 0.06 * a) q.y -= 0.10 * a * hash(vec2(cid, 2.0));
  float sp = 0.014 * a * uA;
  vec3 c;
  if (uA > 0.5){ c.r = vid(q + vec2(sp, 0.0)).r; c.g = vid(q).g; c.b = vid(q - vec2(sp, 0.0)).b; }
  else c = vid(q);
  c *= 1.0 - 0.10 * a * step(0.5, fract(uv.y * uRes.y * 0.5));
  c += (hash(floor(p * vec2(160.0, 90.0)) + tt) - 0.5) * 0.14 * a;
  float lv = mix(256.0, 32.0, smoothstep(0.6, 1.0, a));
  c = floor(c * lv + 0.5) / lv;
  return clamp(c, 0.0, 1.0);
}

vec3 grid(vec2 uv){
  vec2 p = toImg(uv);
  vec2 d = uTexel * 3.0;
  vec2 g = vec2(pres(p + vec2(d.x, 0.0)) - pres(p - vec2(d.x, 0.0)), pres(p + vec2(0.0, d.y)) - pres(p - vec2(0.0, d.y)));
  vec2 q = p + g * 0.08 * uStr;
  vec2 gq = vec2(q.x * uAsp, q.y) * uA;
  float cellPx = uRes.y / (uCover.y * uA);
  float px = uDpr / cellPx;
  vec2 dd = min(fract(gq), 1.0 - fract(gq));
  float w = 1.3 * px;
  float line = 1.0 - smoothstep(w * 0.5, w * 0.5 + px, min(dd.x, dd.y));
  float node = 1.0 - smoothstep(w * 0.6, w * 1.6 + px, length(dd));
  line = max(line, node * 0.9);
  float lit = clamp(0.62 + dot(g, vec2(-0.7, 0.7)) * 7.0 * uStr + pres(p) * 0.25, 0.3, 1.5);
  vec3 base = uB > 0.5 ? vid(q) * 0.5 : vec3(0.02, 0.02, 0.04);
  return clamp(base + vec3(1.0) * line * lit, 0.0, 1.0);
}

vec3 raster(vec2 uv){
  float cell = uA * uDpr;
  vec2 s = uv * uRes;
  float ang = 0.6;
  mat2 R = mat2(cos(ang), -sin(ang), sin(ang), cos(ang));
  vec2 gq = R * s / cell;
  vec2 id = floor(gq) + 0.5;
  vec2 cen = (id * cell) * R;
  vec2 pi = toImg(cen / uRes);
  vec3 col = vid(pi);
  float lum = dot(col, vec3(0.299, 0.587, 0.114));
  float m = fld(pi).r;
  float L = clamp((lum - 0.05) * 1.35, 0.0, 1.0);
  if (uC > 0.5) L = 1.0 - L;
  float r = 0.52 * cell * sqrt(L);
  r *= 1.0 + m * 1.1 * uStr;
  r += m * 0.25 * cell * uStr * (0.5 + 0.5 * sin(uTime * 10.0 + length(id) * 0.6));
  float dist = length(gq - id) * cell;
  float dotM = 1.0 - smoothstep(r - uDpr, r + uDpr, dist);
  if (uC > 0.5){
    vec3 ink = uB > 0.5 ? col * 0.75 : vec3(0.05);
    return mix(vec3(0.96, 0.95, 0.92), ink, dotM);
  }
  vec3 ink = uB > 0.5 ? min(col * 1.3, 1.0) : vec3(1.0);
  return mix(vec3(0.02, 0.02, 0.04), ink, dotM);
}

float caustic(vec2 uv, float time){
  vec2 p = mod(uv * 6.28318530718, 6.28318530718) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 5; n++){
    float t = time * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(t - i.x) + sin(t + i.y), sin(t - i.y) + cos(t + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + t) / inten), p.y / (cos(i.y + t) / inten)));
  }
  c /= 5.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}

vec3 water(vec2 uv){
  float asp = uRes.x / uRes.y;
  vec2 p = toImg(uv);
  float f = fld(p).r;
  float t = uTime;
  vec2 wv = vec2(sin(p.y * 22.0 + t * 1.7) + 0.7 * sin(p.y * 9.0 - t * 1.1), cos(p.x * 19.0 + t * 1.4) + 0.7 * cos(p.x * 8.0 - t * 0.9));
  float mv = f * 0.02 * uStr + uE * 0.01 * uStr;      // движение человека «будит» воду
  vec2 cuv = p * vec2(uAsp, 1.0) * uB;
  vec3 c;
  if (uA < 0.5){
    // бассейн: обычная картинка, поверх — бегущая солнечная сетка
    vec2 q = p + wv * (0.0035 + mv);
    float k = caustic(cuv + wv * 0.006, t * 0.5 + 23.0);
    c = vid(q) * vec3(0.80, 0.95, 1.0) + vec3(0.55, 0.95, 1.0) * k * (0.55 + 0.3 * uStr);
  } else if (uA < 1.5){
    // под водой: всё качается, синий туман, свет сверху
    vec2 q = p + wv * (0.009 + mv * 1.5);
    float depth = smoothstep(0.0, 1.0, uv.y);
    float sp = 0.004 + mv * 0.5;
    vec3 base = vec3(vid(q + vec2(sp, 0.0)).r, vid(q).g, vid(q - vec2(sp, 0.0)).b);
    c = mix(base * vec3(0.45, 0.85, 1.0), vec3(0.02, 0.22, 0.32), 0.22 + 0.4 * depth);
    float k = caustic(cuv * 0.8 + wv * 0.01, t * 0.4 + 11.0);
    c += vec3(0.45, 0.95, 1.0) * k * (1.0 - 0.65 * depth) * (0.4 + 0.3 * uStr);
    float shaft = pow(0.5 + 0.5 * sin((uv.x + uv.y * 0.35) * 9.0 + t * 0.3), 3.0) * (1.0 - depth) * 0.13;
    c += vec3(0.4, 0.9, 1.0) * shaft;
    c *= 1.0 - 0.35 * smoothstep(0.45, 0.95, length((uv - 0.5) * vec2(asp * 0.7, 1.0)));
  } else {
    // банка с водой: линза-преломление, уровень воды, блики стекла
    vec2 jc = vec2(0.5, 0.52);
    vec2 hs = vec2(min(0.30 / asp, 0.42), 0.40);
    vec2 hb = hs * vec2(asp, 1.0);
    vec2 pp = (uv - jc) * vec2(asp, 1.0);
    float rr = 0.09;
    vec2 qd = abs(pp) - hb + rr;
    float dist = length(max(qd, 0.0)) + min(max(qd.x, qd.y), 0.0) - rr;
    float inside = 1.0 - smoothstep(-0.004, 0.004, dist);
    float u = clamp(pp.x / hb.x, -1.0, 1.0);
    c = vid(p) * 0.85;
    float ys = jc.y - hs.y + 0.16 + sin(uv.x * 30.0 + t * 2.0) * (0.003 + mv * 0.25);
    float below = 1.0 - smoothstep(-0.004, 0.004, ys - uv.y);
    float kk = 0.55 + 1.4 * u * u;
    vec2 sj = vec2(jc.x + (uv.x - jc.x) * kk, jc.y + (uv.y - jc.y) * (0.85 + 0.35 * u * u)) + wv * (0.003 + mv);
    vec2 pj = toImg(sj);
    float sp = 0.006 * u;
    vec3 wcol = vec3(vid(pj + vec2(sp, 0.0)).r, vid(pj).g, vid(pj - vec2(sp, 0.0)).b) * vec3(0.82, 0.96, 1.0);
    wcol += vec3(0.5, 0.95, 1.0) * caustic(cuv + wv * 0.006, t * 0.5 + 23.0) * 0.4 * (0.6 + 0.4 * uStr);
    vec3 acol = vid(p) * 0.92;
    vec3 jcol = mix(acol, wcol, below);
    jcol *= 1.0 - 0.45 * smoothstep(0.6, 1.0, abs(u));
    jcol += vec3(0.6, 0.9, 1.0) * (1.0 - smoothstep(0.0, 0.006, abs(uv.y - ys))) * 0.35;
    float strip = (1.0 - smoothstep(0.0, 0.035, abs(u + 0.72))) * 0.55 + (1.0 - smoothstep(0.0, 0.02, abs(u - 0.8))) * 0.25;
    jcol += vec3(strip) * (1.0 - smoothstep(0.55, 0.95, abs(pp.y / hb.y)));
    float rim = smoothstep(-0.022, -0.012, dist) * (1.0 - smoothstep(-0.004, 0.0, dist));
    jcol = mix(jcol, vec3(0.85, 0.95, 1.0), rim * 0.5);
    c = mix(c, jcol, inside);
    c += vec3(1.0) * (1.0 - smoothstep(0.0, 0.004, abs(dist))) * 0.35;
  }
  return clamp(c, 0.0, 1.0);
}

void main(){
  vec3 c;
  if (uMode < 0.5) c = glitch(vUv);
  else if (uMode < 1.5) c = grid(vUv);
  else if (uMode < 2.5) c = raster(vUv);
  else c = water(vUv);
  gl_FragColor = vec4(c, 1.0);
}`;

const FX = (() => {
  const cv = fxCanvas;

      let q = 0; for (let k = -r; k <= r; k++) q += tmpB[clamp(y + k, 0, h - 1)*w + x];

    fgl.uniform2f(U.uRes, W, H); fgl.uniform1f(U.uAsp, a); fgl.uniform1f(U.uDpr, dpr);

    else if (mode === 1){ fgl.uniform1f(U.uA, gridN); fgl.uniform1f(U.uB, gridVideo ? 1 : 0); fgl.uniform1f(U.uC, 0); }

})();

  if (e === 3) return [
    str,
    {l: 'RGB-раздвиг', act: () => { glRGB = !glRGB; }, on: () => glRGB},
    {l: 'Только где движение', act: () => { glLocal = !glLocal; }, on: () => glLocal}
  ];
  if (e === 4) return [
    str,
    {l: 'Густота', range: {min: 10, max: 60, step: 1, get: () => gridN, set: v => gridN = v}},
    {l: 'Видео под сеткой', act: () => { gridVideo = !gridVideo; }, on: () => gridVideo}
  ];
  if (e === 5) return [
    str,
    {l: 'Размер', range: {min: 5, max: 22, step: 1, get: () => dotPx, set: v => dotPx = v}},
    {l: 'Цветные', act: () => { dotColor = !dotColor; }, on: () => dotColor},
    {l: 'Светлый фон', act: () => { dotInv = !dotInv; }, on: () => dotInv}
  ];
  return [
    ...['Бассейн', 'Под водой', 'Банка'].map((l, i) => ({l, act: () => { waterVar = i; toast(WATER_NAMES[i]); }, on: () => waterVar === i})),
    str,
    {l: 'Волны', range: {min: 0.8, max: 3.5, step: 0.1, get: () => waterScale, set: v => waterScale = v}}
  ];
}
let chipDefs = [], chipEls = [];
function buildChips(){
  chipsEl.innerHTML = ''; chipDefs = chipsFor(effect); chipEls = [];
  for (const c of chipDefs){
    let el;
    if (c.range){
      el = document.createElement('label'); el.append(c.l + ' ');
      const r = document.createElement('input'); r.type = 'range'; Object.assign(r, {min: c.range.min, max: c.range.max, step: c.range.step, value: c.range.get()});
      r.oninput = () => c.range.set(+r.value); el.append(r);
    } else {
      el = document.createElement('button'); el.onclick = () => { c.act(); refreshChips(); };
    }
    chipsEl.append(el); chipEls.push(el);
  }
  refreshChips();
}
function refreshChips(){
  chipDefs.forEach((c, i) => {
    if (!c.range){ chipEls[i].textContent = typeof c.l === 'function' ? c.l() : c.l; chipEls[i].classList.toggle('on', !!(c.on && c.on())); }
  });
}
function setEffect(n){
  effect = n;
  warpCanvas.style.display = n === 1 ? 'block' : 'none';
  auraCanvas.style.display = n === 2 ? 'block' : 'none';
  fxCanvas.style.display = n >= 3 ? 'block' : 'none';
  if (n === 1) warpReset();
  if (n === 2) AURA.enter();
  modeBtns.forEach(b => b.classList.toggle('on', +b.dataset.e === n));
  hintEl.textContent = '←/→ или E — сменить эффект · A — авто-смена · F — полный экран · H — скрыть панель · ' + HINTS[n];
  buildChips(); toast(EFFECTS[n]);
}
function nextEffect(dir = 1){ setEffect(((effect - 1 + dir + NFX) % NFX) + 1); }
modeBtns.forEach(b => b.onclick = () => { setEffect(+b.dataset.e); autoT = performance.now() / 1000; });

// панель сама прячется через несколько секунд, возвращается по касанию/движению мыши
let idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 7000); }
['pointerdown', 'pointermove', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, {passive: true}));
if (isTouch) hintEl.style.display = 'none';

/* ================= ГЛАВНЫЙ ЦИКЛ ================= */
let vKey = '';
function checkDims(){
  if (!video.videoWidth) return;
  const k = video.videoWidth + 'x' + video.videoHeight;
  if (k === vKey) return;
  if (vKey){ gl = null; AURA.reset(); FX.reset(); }   // телефон повернули — пересобираем буферы
  vKey = k;
}
function frame(now){
  requestAnimationFrame(frame);
  if (!started) return;
  const t = now / 1000;
  checkDims();
  if (auto && t - autoT > 30){ autoT = t; nextEffect(1); }
  if (effect === 1) warpFrame(t); else if (effect === 2) AURA.frame(now); else FX.frame(t, effect - 3);
}
requestAnimationFrame(frame);

/* ================= ЗАПУСК КАМЕРЫ (сразу при открытии страницы) ================= */
const ui = $('ui'), msg = $('msg'), retry = $('retry');
async function getCam(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const e = new Error('no api'); e.name = 'NoApi'; throw e; }
  const w = isTouch ? 960 : 1280, h = isTouch ? 540 : 720;
  const tries = [{video: {facingMode: 'user', width: {ideal: w}, height: {ideal: h}}, audio: false}, {video: {facingMode: 'user'}, audio: false}, {video: true, audio: false}];
  let lastErr;
  for (const c of tries){
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (e){ lastErr = e; if (e.name === 'NotAllowedError' || e.name === 'SecurityError') throw e; }
  }
  throw lastErr;
}
function camError(e){
  const n = e && e.name;
  if (n === 'NoApi') return 'Браузер не даёт доступ к камере. Открой страницу по https:// (не как файл) и не во встроенном браузере мессенджера, а в Safari или Chrome.';
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Доступ к камере запрещён. Разреши камеру для этого сайта и нажми «Повторить».';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'Камера не найдена.';
  if (n === 'NotReadableError' || n === 'AbortError') return 'Камера занята другим приложением.';
  return 'Не удалось запустить: ' + (e && e.message || e);
}
let fails = 0, lastCT = -1, loopOn = false;
async function start(){
  retry.style.display = 'none';
  try {
    msg.textContent = 'Запускаю камеру… Разреши доступ, когда браузер спросит.';
    const stream = await getCam();
    video.srcObject = stream; await video.play();
    if (!video.videoWidth) await new Promise(r => video.addEventListener('loadedmetadata', r, {once: true}));
    started = true; autoT = performance.now() / 1000;
    ui.style.display = 'none'; document.body.classList.add('started'); wake();
    setEffect(1);                      // стартуем с «Времени» — ему модель не нужна
    if (!loopOn){ loopOn = true; segLoop(); }
    setTimeout(() => hintEl.style.opacity = 0, 20000);
    loadSeg();                         // модель для ауры грузится в фоне
  } catch (e){
    msg.textContent = camError(e); retry.style.display = 'block';
  }
}
async function loadSeg(){
  try {
    seg = new SelfieSegmentation({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${f}`});
    seg.setOptions({modelSelection: video.videoWidth / video.videoHeight >= 1.2 ? 1 : 0});
    seg.onResults(r => { if (effect === 2) AURA.analyze(r.segmentationMask); else if (effect === 4) FX.setMask(r.segmentationMask); });
    await seg.initialize(); segReady = true;
  } catch (err){
    console.warn('segmentation off:', err); segOK = false; seg = null;
    if (effect === 2) toast('Модель не загрузилась: аура строится по движению');
  }
}
// сегментация нужна только ауре и сетке; в остальных эффектах она не работает и не грузит процессор
async function segLoop(){
  try {
    if ((effect === 2 || effect === 4) && video.readyState >= 2 && video.currentTime !== lastCT){
      lastCT = video.currentTime;
      if (segReady && segOK && fails < 3){ await seg.send({image: video}); fails = 0; }
      else if (effect === 2) AURA.analyze(null);   // пока модель грузится (или её нет) — аура по движению
    }
  } catch (e){ console.warn(e); if (++fails >= 3){ segOK = false; segReady = false; } }
  requestAnimationFrame(segLoop);
}
retry.onclick = start;

/* ================= КЛАВИАТУРА ================= */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'tab') e.preventDefault();
  if (!started) return;
  if (k === 'e' || k === 'tab' || k === 'у' || k === 'arrowright'){ nextEffect(1); autoT = performance.now() / 1000; }
  if (k === 'arrowleft'){ nextEffect(-1); autoT = performance.now() / 1000; }
  if (k === 'a'){ auto = !auto; autoT = performance.now() / 1000; toast('Авто-смена эффектов: ' + (auto ? 'вкл (каждые 30 с)' : 'выкл')); }
  if (k === 'f') document.documentElement.requestFullscreen?.();
  if (k === 'h') document.body.classList.toggle('noui');
  if (effect === 1){
    if (k >= '1' && k <= '4'){ warpMode = +k - 1; toast('Развёртка: ' + WARP_MODES[warpMode]); }
    if (k === 'r'){ rev = !rev; toast('Направление развёрнуто: ' + (rev ? 'да' : 'нет')); }
    if (k === 'x'){ chroma = !chroma; toast('RGB-раздвиг: ' + (chroma ? 'вкл' : 'выкл')); }
    if (k === '-' || k === '_'){ DMAX = Math.max(6, DMAX - 4); toast('Глубина времени: ' + (DMAX / WARP.FPS).toFixed(1) + ' с'); }
    if (k === '=' || k === '+'){ DMAX = Math.min(WARP.N - 2, DMAX + 4); toast('Глубина времени: ' + (DMAX / WARP.FPS).toFixed(1) + ' с'); }
  } else if (effect === 2){
    if (k === 'b'){ auraBg = (auraBg + 1) % 3; toast('Фон: ' + AURA_BGS[auraBg]); }
    if (k === '-' || k === '_'){ auraSens = Math.max(0.4, +(auraSens - 0.2).toFixed(1)); toast('Сила: ' + auraSens); }
    if (k === '=' || k === '+'){ auraSens = Math.min(3, +(auraSens + 0.2).toFixed(1)); toast('Сила: ' + auraSens); }
    if (k === ','){ auraDens = Math.max(0.3, +(auraDens - 0.2).toFixed(1)); toast('Частиц: ×' + auraDens); }
    if (k === '.'){ auraDens = Math.min(2, +(auraDens + 0.2).toFixed(1)); toast('Частиц: ×' + auraDens); }
  } else {
    if (k === '-' || k === '_'){ fxStr = Math.max(0.3, +(fxStr - 0.1).toFixed(1)); toast('Сила: ' + fxStr); }
    if (k === '=' || k === '+'){ fxStr = Math.min(2, +(fxStr + 0.1).toFixed(1)); toast('Сила: ' + fxStr); }
    if (effect === 3){ if (k === 'x') glRGB = !glRGB; if (k === 'z') glLocal = !glLocal; }
    if (effect === 4){
      if (k === 'x') gridVideo = !gridVideo;
      if (k === ',') gridN = Math.max(10, gridN - 3); if (k === '.') gridN = Math.min(60, gridN + 3);
    }
    if (effect === 5){
      if (k === 'x') dotColor = !dotColor; if (k === 'z') dotInv = !dotInv;
      if (k === ',') dotPx = Math.max(5, dotPx - 1); if (k === '.') dotPx = Math.min(22, dotPx + 1);
    }
    if (effect === 6){
      if (k >= '1' && k <= '3'){ waterVar = +k - 1; toast(WATER_NAMES[waterVar]); }
      if (k === ',') waterScale = Math.max(0.8, +(waterScale - 0.2).toFixed(1)); if (k === '.') waterScale = Math.min(3.5, +(waterScale + 0.2).toFixed(1));
    }
  }
  buildChips();
});

start();
</script>
</body>
